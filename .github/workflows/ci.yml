name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Frontend (browser tests, mocked backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e

  hopsearch:
    name: Hop search (pure Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # The Sage-dependent tests skip themselves here; the next job runs them.
      - run: pytest

  backend:
    name: Backend (in its Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image Railway deploys
        run: docker build -f backend/Dockerfile -t leaper-backend .
      - name: Run all Python tests inside it
        # The image's entrypoint runs its arguments as one shell command
        # (sage -sh -c "$*"), so the command is passed as a single string;
        # wrapping it in `bash -c "..."` gets flattened and starts a Sage
        # prompt instead.
        run: |
          docker run --rm --user root -v "$PWD":/repo -w /repo leaper-backend \
            "sage -pip install --no-cache-dir pytest httpx && sage -python -m pytest"
