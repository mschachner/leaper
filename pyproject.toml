[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leaper"
version = "0.1.0"
description = "Utilities for calculating leap groups."
authors = [{ name = "Mark" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
]

[project.urls]
Home = "https://example.com"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # The backend forks from a threaded process on purpose (see backend/app.py).
    "ignore:.*multi-threaded.*fork.*:DeprecationWarning",
]
